name: Crawler Workflow

on:
  schedule:
    # 每天 UTC 的 0点 和 12点 运行（对应北京时间 08:00 和 20:00）
    - cron: '0 0,12 * * *'
  # 允许手动触发，方便你随时测试
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl akshare playwright
          playwright install

      - name: Run script
        run: |
          python main.py
        env:
          QHKCH_USER: ${{ secrets.QHKCH_USER }}
          QHKCH_PWD: ${{ secrets.QHKCH_PWD }}
