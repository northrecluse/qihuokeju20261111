name: Crawler Workflow

on:
  schedule:
    # 每天 UTC 的 0点 和 12点 运行（对应北京时间 08:00 和 20:00）
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl akshare playwright chinese_calendar ddddocr
          playwright install

      - name: Run script
        run: |
          python main.py
        env:
          QHKCH_USER: ${{ secrets.QHKCH_USER }}
          QHKCH_PWD: ${{ secrets.QHKCH_PWD }}

      # 【核心新增】：将生成的 Excel 文件夹打包并作为云端产物保存
      - name: Upload Excel Data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: longhuabang-data-${{ github.run_number }}
          path: 龙虎榜数据_长期历史汇总/
          retention-days: 90 # 在云端保留 90 天，每次运行都会生成包含最新全量数据的压缩包
